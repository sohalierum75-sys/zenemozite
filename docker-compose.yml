version: '3.8'

services:
  zenemozite:
    image: ${IMAGE_NAME:-ghcr.io/yourusername/zenemozite:latest}
    container_name: zenemozite
    restart: unless-stopped
    
    ports:
      - "80:5000"
      - "5000:5000"
    
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=file:/app/data/zenemozite.db
      # TMDB API key should be set in .env file or here
      - TMDB_API_KEY=${TMDB_API_KEY}
      - CACHE_DURATION_HOURS=${CACHE_DURATION_HOURS:-24}
      # Telegram CDN (private channel used as the file cache backend) —
      # read from the host .env; the CDN worker fails fast when missing.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELEGRAM_API_ID=${TELEGRAM_API_ID:-23271365}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH:-59a8393f1c17083798b42333d16ff224}
      - TELEGRAM_STRING_SESSION=${TELEGRAM_STRING_SESSION:-}
      # Local Bot API server — reachable via the shared Docker network by its
      # service name (NOT localhost/172.17.0.1, which caused ECONNREFUSED).
      # NOTE: the backend appends /bot<token> itself, so do NOT add /bot here.
      - TELEGRAM_LOCAL_API_URL=${TELEGRAM_LOCAL_API_URL:-http://telegram-api:8081}
      - TELEGRAM_API_DATA_DIR=${TELEGRAM_API_DATA_DIR:-/var/lib/telegram-bot-api}
      # Low-RAM tuning: 512MB chunks + 1 torrent at a time prevent OOM crashes
      - TELEGRAM_CHUNK_GB=${TELEGRAM_CHUNK_GB:-0.5}
      - CDN_MAX_CONCURRENT=${CDN_MAX_CONCURRENT:-1}
      # Shared volume with telegram-api -> enables zero-RAM file:// uploads
      - TELEGRAM_SHARED_DIR=${TELEGRAM_SHARED_DIR:-/app/shared}
      # Telegram Webhook secret token for authenticating channel_post updates
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-zinemo_telegram_sec_token_2026}
      # Cryptographic HMAC signing secret for secure direct download links
      - DOWNLOAD_SIGNING_SECRET=${DOWNLOAD_SIGNING_SECRET:-zinemo_download_secure_signing_secret_2026}
      # Concurrency limit per client IP for direct streaming downloads
      - MAX_CONCURRENT_DOWNLOADS=${MAX_CONCURRENT_DOWNLOADS:-4}
      # Optional Nginx internal file offloading
      - USE_X_ACCEL_REDIRECT=${USE_X_ACCEL_REDIRECT:-false}
    volumes:
      # Persist SQLite database across container restarts
      - zenemozite-data:/app/data
      # Torrent downloads land here; telegram-api reads them via file://
      - telegram-shared:/app/shared
      # Map local Telegram API data volume for direct fs.createReadStream streaming
      - ./tg-api-data:/var/lib/telegram-bot-api:ro
    
    networks:
      - zenemozite-network
    
    # Wait for the Local Bot API server before starting the backend
    depends_on:
      - telegram-api
    
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/status', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    labels:
      - "com.zenemozite.description=Zenemozite Full-Stack Service (Frontend + Backend)"
      - "com.zenemozite.version=13.0"

  # ---------------------------------------------------------------------------
  # Telegram Local Bot API server ("--local" mode: up to 2GB uploads and the
  # /file/bot<token>/... download endpoint used by telegramStore.js).
  # Reachable from the backend at http://telegram-api:8081 (service name).
  # Get TELEGRAM_API_ID / TELEGRAM_API_HASH from https://my.telegram.org
  # ---------------------------------------------------------------------------
  telegram-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-api
    restart: unless-stopped

    ports:
      - "8081:8081"

    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID:-23271365}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH:-59a8393f1c17083798b42333d16ff224}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      # Enable --local mode (required for 2GB uploads + local file downloads)
      - TELEGRAM_LOCAL=1
      - TELEGRAM_LOG_LEVEL=warn

    volumes:
      # Persist bot session + uploaded file store across restarts on host volume
      - ./tg-api-data:/var/lib/telegram-bot-api
      # Same shared volume as the backend: the Local Bot API server reads
      # torrent files from here via file:// (zero-RAM uploads, no HTTP copy)
      - telegram-shared:/app/shared:ro

    networks:
      - zenemozite-network

volumes:
  zenemozite-data:
    driver: local
  telegram-shared:
    driver: local

networks:
  zenemozite-network:
    driver: bridge
