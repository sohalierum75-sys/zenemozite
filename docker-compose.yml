version: '3.8'

services:
  zenemozite:
    image: ${IMAGE_NAME:-ghcr.io/yourusername/zenemozite:latest}
    container_name: zenemozite
    restart: unless-stopped
    
    ports:
      - "80:5000"
      - "5000:5000"
    
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=file:/app/data/zenemozite.db
      # TMDB API key should be set in .env file or here
      - TMDB_API_KEY=${TMDB_API_KEY}
      - CACHE_DURATION_HOURS=${CACHE_DURATION_HOURS:-24}
      # Telegram CDN (private channel used as the file cache backend) —
      # read from the host .env; the CDN worker fails fast when missing.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      # Local Bot API server — reachable via the shared Docker network by its
      # service name (NOT localhost/172.17.0.1, which caused ECONNREFUSED).
      # NOTE: the backend appends /bot<token> itself, so do NOT add /bot here.
      - TELEGRAM_LOCAL_API_URL=${TELEGRAM_LOCAL_API_URL:-http://telegram-api:8081}
      # Low-RAM tuning: 512MB chunks + 1 torrent at a time prevent OOM crashes
      - TELEGRAM_CHUNK_GB=${TELEGRAM_CHUNK_GB:-0.5}
      - CDN_MAX_CONCURRENT=${CDN_MAX_CONCURRENT:-1}
    volumes:
      # Persist SQLite database across container restarts
      - zenemozite-data:/app/data
    
    networks:
      - zenemozite-network
    
    # Wait for the Local Bot API server before starting the backend
    depends_on:
      - telegram-api
    
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/status', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    labels:
      - "com.zenemozite.description=Zenemozite Full-Stack Service (Frontend + Backend)"
      - "com.zenemozite.version=13.0"

  # ---------------------------------------------------------------------------
  # Telegram Local Bot API server ("--local" mode: up to 2GB uploads and the
  # /file/bot<token>/... download endpoint used by telegramStore.js).
  # Reachable from the backend at http://telegram-api:8081 (service name).
  # Get TELEGRAM_API_ID / TELEGRAM_API_HASH from https://my.telegram.org
  # ---------------------------------------------------------------------------
  telegram-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-api
    restart: unless-stopped

    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      # Enable --local mode (required for 2GB uploads + local file downloads)
      - TELEGRAM_LOCAL=1
      - TELEGRAM_LOG_LEVEL=warn

    volumes:
      # Persist bot session + uploaded file store across restarts
      - telegram-api-data:/var/lib/telegram-bot-api

    networks:
      - zenemozite-network

    # Port 8081 is intentionally NOT published to the host: the backend talks
    # to it over the internal Docker network. Uncomment for debugging only:
    # ports:
    #   - "127.0.0.1:8081:8081"

volumes:
  zenemozite-data:
    driver: local
  telegram-api-data:
    driver: local

networks:
  zenemozite-network:
    driver: bridge
