name: Build and Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build Docker Image and Push to GHCR
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-
            type=ref,event=branch
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
      
      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.meta.outputs.digest }}"

  deploy-to-vps:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /opt/zenemozite
            
            # Create docker-compose.yml if it doesn't exist
            cat > docker-compose.yml << 'EOF'
            version: '3.8'

            services:
              zenemozite:
                image: ghcr.io/sohalierum75-sys/zenemozite:latest
                container_name: zenemozite
                restart: unless-stopped
                
                ports:
                  - "80:5000"
                  - "5000:5000"
                
                environment:
                  - NODE_ENV=production
                  - PORT=5000
                  - DATABASE_URL=file:/app/data/zenemozite.db
                  - TMDB_API_KEY=${TMDB_API_KEY}
                  - CACHE_DURATION_HOURS=${CACHE_DURATION_HOURS:-24}
                  # Telegram CDN — loaded from the VPS /opt/zenemozite/.env below
                  - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
                  - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
                  # Local Bot API server — resolved by Docker service name on the
                  # shared network (NOT localhost/172.17.0.1).
                  # NOTE: the backend appends /bot<token> itself; no /bot suffix.
                  - TELEGRAM_LOCAL_API_URL=${TELEGRAM_LOCAL_API_URL:-http://telegram-api:8081}
                  # Low-RAM tuning: 512MB chunks + 1 torrent at a time prevent OOM crashes
                  - TELEGRAM_CHUNK_GB=${TELEGRAM_CHUNK_GB:-0.5}
                  - CDN_MAX_CONCURRENT=${CDN_MAX_CONCURRENT:-1}
                
                volumes:
                  - zenemozite-data:/app/data
                
                networks:
                  - zenemozite-network
                
                # Wait for the Local Bot API server before starting the backend
                depends_on:
                  - telegram-api
                
                healthcheck:
                  test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/status', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
                  interval: 30s
                  timeout: 10s
                  retries: 3
                  start_period: 40s
                
                labels:
                  - "com.zenemozite.description=Zenemozite Full-Stack Service (Frontend + Backend)"
                  - "com.zenemozite.version=13.0"
            
              # Telegram Local Bot API server (--local mode: 2GB uploads +
              # /file/bot<token>/ downloads). Backend reaches it at
              # http://telegram-api:8081 over the shared Docker network.
              telegram-api:
                image: aiogram/telegram-bot-api:latest
                container_name: telegram-api
                restart: unless-stopped
                
                environment:
                  - TELEGRAM_API_ID=${TELEGRAM_API_ID}
                  - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
                  - TELEGRAM_LOCAL=1
                  - TELEGRAM_LOG_LEVEL=warn
                
                volumes:
                  - telegram-api-data:/var/lib/telegram-bot-api
                
                networks:
                  - zenemozite-network
            
            volumes:
              zenemozite-data:
                driver: local
              telegram-api-data:
                driver: local

            networks:
              zenemozite-network:
                driver: bridge
            EOF
            
            echo "✅ docker-compose.yml created/updated"
            
            # Ensure Telegram Local Bot API credentials exist in the VPS .env
            # (idempotent: only appended when missing)
            touch .env
            grep -q '^TELEGRAM_API_ID=' .env || echo 'TELEGRAM_API_ID=23271365' >> .env
            grep -q '^TELEGRAM_API_HASH=' .env || echo 'TELEGRAM_API_HASH=59a8393f1c17083798b42333d16ff224' >> .env
            grep -q '^TELEGRAM_LOCAL_API_URL=' .env || echo 'TELEGRAM_LOCAL_API_URL=http://telegram-api:8081' >> .env
            
            # Load environment variables from .env if it exists
            if [ -f .env ]; then
              export $(cat .env | grep -v '^#' | xargs)
            fi
            
            # Pull latest image
            echo "Pulling latest Docker image..."
            docker pull ghcr.io/sohalierum75-sys/zenemozite:latest
            
            # Stop and remove old container
            echo "Stopping old container..."
            docker-compose down
            
            # Start new container
            echo "Starting new container..."
            docker-compose up -d
            
            # Wait for container to be healthy
            echo "Waiting for container to be healthy..."
            sleep 10
            
            # Check if container is running
            if docker-compose ps | grep -q "zenemozite.*Up"; then
              echo "✅ Deployment successful! Container is running."
            else
              echo "❌ Deployment failed! Container is not running."
              docker-compose logs --tail=50
              exit 1
            fi
            
            # Verify application health
            echo "Checking application health..."
            sleep 5
            HEALTH_CHECK=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/api/status)
            
            if [ "$HEALTH_CHECK" = "200" ]; then
              echo "✅ Application is healthy and responding!"
            else
              echo "⚠️  Warning: Application health check returned $HEALTH_CHECK"
              docker-compose logs --tail=30
            fi
            
            # Clean up old images
            echo "Cleaning up old Docker images..."
            docker image prune -af --filter "until=72h"
            
            echo "🚀 Deployment completed successfully!"
      
      - name: Deployment status
        if: success()
        run: |
          echo "✅ Successfully deployed to VPS"
          echo "📦 Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "🌐 Frontend: http://${{ secrets.SERVER_HOST }} (port 80)"
          echo "🔌 Backend API: http://${{ secrets.SERVER_HOST }}:5000/api"
      
      - name: Deployment failed
        if: failure()
        run: |
          echo "❌ Deployment to VPS failed!"
          echo "Please check the logs above for details."
          exit 1
