name: Build and Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build Docker Image and Push to GHCR
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-
            type=ref,event=branch
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
      
      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.meta.outputs.digest }}"

  deploy-to-vps:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /opt/zenemozite
            
            # Set IMAGE_NAME environment variable
            export IMAGE_NAME=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            
            # Pull latest image
            echo "Pulling latest Docker image..."
            docker pull $IMAGE_NAME
            
            # Stop and remove old container
            echo "Stopping old container..."
            docker-compose down
            
            # Start new container
            echo "Starting new container..."
            docker-compose up -d
            
            # Wait for container to be healthy
            echo "Waiting for container to be healthy..."
            sleep 10
            
            # Check if container is running
            if docker-compose ps | grep -q "zenemozite.*Up"; then
              echo "✅ Deployment successful! Container is running."
            else
              echo "❌ Deployment failed! Container is not running."
              docker-compose logs --tail=50
              exit 1
            fi
            
            # Verify application health
            echo "Checking application health..."
            sleep 5
            HEALTH_CHECK=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/api/status)
            
            if [ "$HEALTH_CHECK" = "200" ]; then
              echo "✅ Application is healthy and responding!"
            else
              echo "⚠️  Warning: Application health check returned $HEALTH_CHECK"
              docker-compose logs --tail=30
            fi
            
            # Clean up old images
            echo "Cleaning up old Docker images..."
            docker image prune -af --filter "until=72h"
            
            echo "🚀 Deployment completed successfully!"
      
      - name: Deployment status
        if: success()
        run: |
          echo "✅ Successfully deployed to VPS"
          echo "📦 Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "🌐 Application should be accessible at http://${{ secrets.SERVER_HOST }}:5000"
      
      - name: Deployment failed
        if: failure()
        run: |
          echo "❌ Deployment to VPS failed!"
          echo "Please check the logs above for details."
          exit 1
